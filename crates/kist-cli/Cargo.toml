[package]
name = "kist-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kist"
path = "src/main.rs"

[dependencies]
kist-app.workspace = true
kist-backend.workspace = true
kist-core.workspace = true
kist-crypto.workspace = true
kist-format.workspace = true

anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
gethostname.workspace = true
hex.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true

# 診斷用（bench/memory 歸因）：--features dhat 跑完會在 cwd 寫 dhat.json。
# 暫時加入，歸因完移除。
dhat = { version = "0.3", optional = true }
tracing-subscriber.workspace = true
zeroize.workspace = true

[dev-dependencies]
rand.workspace = true
tempfile.workspace = true

[features]
dhat = ["dep:dhat"]
