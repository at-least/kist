name: CI

# 只手動觸發：所有驗證都在本機跑（cargo fmt/clippy/test/deny + tests/minio-setup.sh），
# 這支只留著給偶爾想看三平台結果時用，避免吃 GitHub Actions 配額。
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: start MinIO (S3 integration tests)
        if: runner.os == 'Linux'
        run: sh tests/minio-setup.sh | sed "s/^export //" >> "$GITHUB_ENV"
        shell: bash
      - name: cargo test
        run: cargo test --workspace

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # 短煙霧（每 target 60 秒）：確保 fuzz target 不會腐化到編不過或斷言失效。
  # 長跑（24h）仍在手動本機跑，見 fuzz/README.md。CI 本身也是手動觸發，
  # 不 dispatch 就零成本。
  fuzz-smoke:
    name: fuzz smoke (60s × 4 targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - run: cargo install cargo-fuzz --locked
      - name: smoke each target
        run: |
          for t in pack cbor chunker parity; do
            sh fuzz/smoke.sh "$t" 60
          done
