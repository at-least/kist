# golangci-lint v2 configuration. The version is pinned here and in
# .github/workflows/ci.yml; bump both together.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # a leaked HTTP body is a leaked connection in the S3 backend
    - errorlint # error comparisons must respect %w wrapping
    - exhaustive # a switch that forgets a new enum value fails silently
    - gosec # this tool handles keys and other people's data
    - misspell
    - nilerr # returning nil after a non-nil err is how data loss starts
    - predeclared
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      check-type-assertions: true
      # `_ = err` is a swallowed error and must be justified with a
      # nolint comment saying why.
      check-blank: true
      # The exception: releasing a resource on a path that is already
      # returning, or already failing. There is nothing a caller can do
      # with the error and no way to write the discard other than `_ =`,
      # so requiring a comment on each one would add noise, not safety.
      # The list is by concrete type, so a Close reached through some
      # other interface still needs a real check or a nolint with a
      # reason -- which is the right default for anything not listed.
      exclude-functions:
        # Writing to the command's own stdout or stderr. A failed write
        # there means the pipe is gone; there is no recovery and no
        # second channel to report it on.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - os.Remove
        - os.RemoveAll
        # The same cleanup calls over SSH and SFTP: closing a connection
        # or a scratch file, or removing a scratch file, on an error path
        # that already has an error to report.
        - (net.Conn).Close
        - (golang.org/x/crypto/ssh.Conn).Close
        - (*github.com/pkg/sftp.Client).Remove
        - (*github.com/pkg/sftp.File).Close
    exhaustive:
      # A default clause is not an answer here: the point is to be told
      # that a new NodeType or algorithm byte was added and some switch
      # was not updated. Format evolution happens by adding enum values,
      # so this check maps directly onto "the format can evolve".
      default-signifies-exhaustive: false
      check:
        - switch
        - map
    revive:
      rules:
        - name: package-comments # 工程規範: every package has a doc.go
        - name: exported # 工程規範: exported API carries godoc
  exclusions:
    generated: lax
    rules:
      # Tests may take shortcuts that production code may not.
      - path: _test\.go$
        linters:
          - gosec
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/at-least/kist
